# Local stack: PostgreSQL + Redis + API + worker + web.
#   docker compose up --build      → http://localhost:3000
# Optional: copy .env.example to .env to configure Gmail / Anthropic.
name: job-hunter

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://jobhunter:jobhunter@postgres:5432/job_hunter?schema=public
  REDIS_URL: redis://redis:6379/0
  CANDIDATE_PROFILE_PATH: /app/candidate/candidate-profile.md
  APP_URL: ${APP_URL:-http://localhost:3000}
  API_PORT: 4000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_PROVIDER: ${AI_PROVIDER:-template}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sandbox}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/email/gmail/callback}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: job_hunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: job-hunter-api:local
    command: ["api"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./candidate:/app/candidate
      - appdata:/data
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    image: job-hunter-api:local
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./candidate:/app/candidate
      - appdata:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata:
